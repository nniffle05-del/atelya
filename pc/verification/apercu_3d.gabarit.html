<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelya : aperçu 3D</title>
<style>
  html, body { height: 100%; margin: 0; background: #e9ecef; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #cartouche { position: fixed; left: 14px; top: 12px; background: rgba(255,255,255,.92); border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 6px rgba(0,0,0,.15); max-width: 300px; }
  #cartouche strong { font-size: 16px; }
  #cartouche p { margin: 4px 0 0; color: #636c76; font-size: 13px; }
  #noms { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .nom { position: absolute; transform: translate(-50%, -50%); background: rgba(255,255,255,.88); border-radius: 5px; padding: 1px 6px; font-size: 12px; text-align: center; white-space: nowrap; }
  #commandes { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 6px; }
  button { font: inherit; border: 1px solid #d9dce1; background: #fff; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  #erreur { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="noms"></div>
<div id="cartouche"><strong>Atelya : aperçu 3D</strong>
  <p>Maquette construite à partir du plan lu et vérifié. Volumes seulement : matières et lumière viendront avec le rendu.</p>
  <p>Glisser : tourner. Molette ou pincer : zoomer.</p></div>
<div id="commandes"><button id="b-noms">Masquer les noms</button><button id="b-dessus">Vue de dessus</button><button id="b-tour">Tourner seul</button></div>
<div id="erreur">Ce navigateur ne peut pas afficher la 3D (WebGL indisponible).</div>
<script>
"use strict";
const D = /*DONNEES*/null;
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { antialias: true, preserveDrawingBuffer: true });
if (!gl) document.getElementById("erreur").style.display = "flex";

const VS = `attribute vec3 p; attribute vec3 n; attribute vec3 c; uniform mat4 m; varying vec3 vc; varying vec3 vn;
void main(){ gl_Position = m * vec4(p, 1.0); vc = c; vn = n; }`;
const FS = `precision mediump float; varying vec3 vc; varying vec3 vn; uniform float a;
void main(){ vec3 l = normalize(vec3(.45, .8, .35)); float d = max(dot(normalize(vn), l), 0.0);
  float d2 = max(dot(normalize(vn), normalize(vec3(-.5, .3, -.6))), 0.0);
  gl_FragColor = vec4(vc * (.52 + .42 * d + .14 * d2), a); }`;
function programme() {
  const s = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const q = gl.createProgram();
  gl.attachShader(q, s(gl.VERTEX_SHADER, VS)); gl.attachShader(q, s(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(q);
  return q;
}
// Les vitres : deux triangles par fenêtre, posés à part car ils sont transparents.
const vitres = [];
for (const [x1, z1, x2, z2, b, h] of D.vitres) {
  const dx = x2 - x1, dz = z2 - z1, l = Math.hypot(dx, dz) || 1, n = [dz / l, 0, -dx / l];
  for (const [x, y, z] of [[x1, b, z1], [x2, b, z2], [x2, h, z2], [x1, b, z1], [x2, h, z2], [x1, h, z1]]) vitres.push(x, y, z, ...n, .55, .75, .9);
}
const xs = [], zs = [];
for (let i = 0; i < D.sommets.length; i += 9) { xs.push(D.sommets[i]); zs.push(D.sommets[i + 2]); }
const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
const taille = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs));

const vue = { az: -.65, el: .85, dist: taille * 1.55, tour: true, noms: true };
function produit(a, b) { const r = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + i] * b[j * 4 + k]; r[j * 4 + i] = s; } return r; }
function matrice() {
  const w = canvas.width, h = canvas.height, f = 1 / Math.tan(.42);
  const pr = new Float32Array([f * h / w, 0, 0, 0, 0, f, 0, 0, 0, 0, -1.002, -1, 0, 0, -.2, 0]);
  const y = vue.el, a = vue.az;
  const eye = [cx + vue.dist * Math.cos(y) * Math.sin(a), vue.dist * Math.sin(y), cz + vue.dist * Math.cos(y) * Math.cos(a)];
  const cible = [cx, D.hauteur * .2, cz];
  const nz = eye.map((v, i) => v - cible[i]); const ln = Math.hypot(...nz); nz.forEach((v, i) => nz[i] = v / ln);
  const hautV = Math.abs(nz[1]) > .995 ? [Math.sin(a), 0, Math.cos(a)].map((v) => -v) : [0, 1, 0];
  const nx = [hautV[1] * nz[2] - hautV[2] * nz[1], hautV[2] * nz[0] - hautV[0] * nz[2], hautV[0] * nz[1] - hautV[1] * nz[0]];
  const lx = Math.hypot(...nx); nx.forEach((v, i) => nx[i] = v / lx);
  const ny = [nz[1] * nx[2] - nz[2] * nx[1], nz[2] * nx[0] - nz[0] * nx[2], nz[0] * nx[1] - nz[1] * nx[0]];
  const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  const mv = new Float32Array([nx[0], ny[0], nz[0], 0, nx[1], ny[1], nz[1], 0, nx[2], ny[2], nz[2], 0, -dot(nx, eye), -dot(ny, eye), -dot(nz, eye), 1]);
  return produit(pr, mv);
}
const noms = document.getElementById("noms");
const elNoms = D.etiquettes.map((e) => { const d = document.createElement("div"); d.className = "nom"; d.innerHTML = ""; d.append(e.nom, document.createElement("br"), `${String(e.surface).replace(".", ",")} m²`); noms.append(d); return d; });

let prog, tampon, tamponV, loc;
if (gl) {
  prog = programme();
  gl.useProgram(prog);
  tampon = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tampon); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(D.sommets), gl.STATIC_DRAW);
  tamponV = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, tamponV); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vitres), gl.STATIC_DRAW);
  loc = { p: gl.getAttribLocation(prog, "p"), n: gl.getAttribLocation(prog, "n"), c: gl.getAttribLocation(prog, "c"), m: gl.getUniformLocation(prog, "m"), a: gl.getUniformLocation(prog, "a") };
  for (const k of ["p", "n", "c"]) gl.enableVertexAttribArray(loc[k]);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(.914, .925, .937, 1);
}
function lier(t) {
  gl.bindBuffer(gl.ARRAY_BUFFER, t);
  gl.vertexAttribPointer(loc.p, 3, gl.FLOAT, false, 36, 0);
  gl.vertexAttribPointer(loc.n, 3, gl.FLOAT, false, 36, 12);
  gl.vertexAttribPointer(loc.c, 3, gl.FLOAT, false, 36, 24);
}
function dessiner() {
  const r = window.devicePixelRatio || 1, w = Math.round(innerWidth * r), h = Math.round(innerHeight * r);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  const m = matrice();
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(loc.m, false, m);
  lier(tampon); gl.uniform1f(loc.a, 1); gl.disable(gl.CULL_FACE); gl.drawArrays(gl.TRIANGLES, 0, D.sommets.length / 9);
  if (vitres.length) { lier(tamponV); gl.uniform1f(loc.a, .45); gl.drawArrays(gl.TRIANGLES, 0, vitres.length / 9); }
  D.etiquettes.forEach((e, i) => {
    const X = e.x, Y = .1, Z = e.y;
    const px = m[0] * X + m[4] * Y + m[8] * Z + m[12], py = m[1] * X + m[5] * Y + m[9] * Z + m[13], pw = m[3] * X + m[7] * Y + m[11] * Z + m[15];
    elNoms[i].style.display = vue.noms && pw > 0 ? "block" : "none";
    elNoms[i].style.left = `${(px / pw * .5 + .5) * innerWidth}px`;
    elNoms[i].style.top = `${(.5 - py / pw * .5) * innerHeight}px`;
  });
}
let avant = 0;
function boucle(t) {
  if (vue.tour) vue.az += Math.min(t - avant, 50) * .00018;
  avant = t;
  dessiner();
  requestAnimationFrame(boucle);
}
if (gl) requestAnimationFrame(boucle);

const contacts = new Map();
let ecartPince = 0;
canvas.addEventListener("pointerdown", (ev) => { canvas.setPointerCapture(ev.pointerId); contacts.set(ev.pointerId, [ev.clientX, ev.clientY]); vue.tour = false; });
canvas.addEventListener("pointermove", (ev) => {
  const c = contacts.get(ev.pointerId);
  if (!c) return;
  if (contacts.size === 2) {
    contacts.set(ev.pointerId, [ev.clientX, ev.clientY]);
    const [a, b] = [...contacts.values()], e = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (ecartPince) vue.dist = Math.max(taille * .3, Math.min(taille * 4, vue.dist * ecartPince / e));
    ecartPince = e;
    return;
  }
  vue.az -= (ev.clientX - c[0]) * .007;
  vue.el = Math.max(.08, Math.min(1.56, vue.el + (ev.clientY - c[1]) * .006));
  contacts.set(ev.pointerId, [ev.clientX, ev.clientY]);
});
const lacher = (ev) => { contacts.delete(ev.pointerId); ecartPince = 0; };
canvas.addEventListener("pointerup", lacher);
canvas.addEventListener("pointercancel", lacher);
canvas.addEventListener("wheel", (ev) => { ev.preventDefault(); vue.dist = Math.max(taille * .3, Math.min(taille * 4, vue.dist * Math.exp(ev.deltaY / 800))); }, { passive: false });
document.getElementById("b-noms").onclick = (ev) => { vue.noms = !vue.noms; ev.target.textContent = vue.noms ? "Masquer les noms" : "Afficher les noms"; };
document.getElementById("b-dessus").onclick = () => { vue.tour = false; vue.el = 1.56; vue.az = 0; };
document.getElementById("b-tour").onclick = () => { vue.tour = !vue.tour; if (vue.tour && vue.el > 1.2) vue.el = .85; };
</script>
</body>
</html>
